; Echo firmware for testing bluetooth_serial_next on real hardware.
; Needs a chip with Bluetooth Classic: the original ESP32 (ESP32-WROOM-32,
; ESP32-WROVER). S2, S3, C3 and C6 have BLE only.
; Flash: pio run -t upload
; It shows up as "SPP echo"; the USB serial port (115200) logs connections
; and takes the same commands.

[env:esp32dev]
platform = espressif32
framework = arduino
board = esp32dev
monitor_speed = 115200
